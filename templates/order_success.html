<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation | Bloom & Glow</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff7fa;
            text-align: center;
            padding: 60px 20px;
        }

        .success-box {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 40px 25px;
            border-radius: 18px;
            box-shadow: 0 5px 20px #ead2df;
        }

        h1 {
            color: #8b3d65;
        }

        p {
            color: #555;
            line-height: 1.7;
        }

        a {
            display: inline-block;
            background: #8b3d65;
            color: white;
            padding: 13px 25px;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="success-box">
        <h1>🌷 Thank You!</h1>

        <h2>Your order details were submitted.</h2>

        <p>Thank you, {{ customer_name }}!</p>
        <p>Payment Status: {{ payment_status }}</p>
        <p>Payment method: {{ payment_method }}</p>

        <p>We appreciate your shopping with Bloom & Glow.</p>

        <a href="{{ url_for('home') }}">Continue Shopping</a>
    </div>
</body>
</html>
