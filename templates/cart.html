
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shopping Cart | Bloom & Glow</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Georgia, serif;
}

body {
    background: #fffaf7;
    color: #684c4c;
    padding: 40px 7%;
}

h1 {
    text-align: center;
    color: #b75d78;
    margin-bottom: 35px;
}

.cart-container {
    max-width: 900px;
    margin: auto;
}

.cart-item {
    display: flex;
    align-items: center;
    gap: 20px;
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 18px;
    box-shadow: 0 5px 20px #e9cfd4;
}

.cart-item img {
    width: 110px;
    height: 110px;
    object-fit: cover;
    border-radius: 12px;
}

.product-details {
    flex: 1;
}

.product-details h3 {
    color: #a64f6d;
    margin-bottom: 10px;
}

.quantity button {
    padding: 7px 13px;
    background: #fce8e8;
    border: none;
    cursor: pointer;
    color: #93445f;
    font-size: 17px;
}

.remove-btn {
    background: #b75d78;
    color: white;
    padding: 9px 14px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
}

.total {
    text-align: right;
    margin-top: 30px;
    color: #a64f6d;
    font-size: 25px;
}

.checkout-btn {
    display: block;
    margin: 30px auto;
    background: #bd6c85;
    color: white;
    padding: 15px 40px;
    border: none;
    border-radius: 30px;
    font-size: 17px;
    cursor: pointer;
}

.checkout-btn:hover {
    background: #93445f;
}

.back-btn {
    display: block;
    text-align: center;
    color: #a64f6d;
    text-decoration: none;
    margin-top: 20px;
}

@media(max-width:600px) {
    body {
        padding: 25px 4%;
    }

    .cart-item {
        flex-wrap: wrap;
    }

    .cart-item img {
        width: 85px;
        height: 85px;
    }
}
.checkout-btn {
    display: inline-block;
    padding: 14px 25px;
    background: #bd6c85;
    color: white;
    text-decoration: none;
    border-radius: 25px;
    margin-top: 20px;
}

.checkout-btn:hover {
    background: #93445f;
}
</style>
</head>

<body>

<h1>🛒 Your Shopping Cart ♡</h1>

<div class="cart-container">

    <div id="cart-items"></div>

    <h2 class="total">
        Total: ₹<span id="total">0</span>
    </h2>

    <button class="checkout-btn" onclick="checkout()">
        Proceed to Checkout ♡
    </button>

    <a href="{{ url_for('home') }}" class="back-btn">
    ← Continue Shopping </a>
</div>

<script>

let cart = JSON.parse(
    localStorage.getItem("bloomCart")
) || [];

function displayCart() {

    const container = document.getElementById("cart-items");

    container.innerHTML = "";

    let total = 0;

    if (cart.length === 0) {

        container.innerHTML =
            "<h2 style='text-align:center'>Your cart is empty ♡</h2>";

        document.getElementById("total").innerText = "0";

        return;
    }

    cart.forEach((item, index) => {

        total += item.price * item.quantity;

        container.innerHTML += `
            <div class="cart-item">

                <img src="${item.image}" alt="Product">

                <div class="product-details">

                    <h3>${escapeHTML(item.name)}</h3>

                    <p>Price: ₹${item.price}</p>

                    <p>Subtotal: ₹${item.price * item.quantity}</p>

                    <div class="quantity">

                        <button onclick="changeQuantity(${index}, -1)">−</button>

                        ${item.quantity}

                        <button onclick="changeQuantity(${index}, 1)">+</button>

                    </div>

                </div>

                <button class="remove-btn"
                    onclick="removeItem(${index})">
                    Remove
                </button>

            </div>
        `;
    });

    document.getElementById("total").innerText = total;
}

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function changeQuantity(index, amount) {

    cart[index].quantity += amount;

    if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
    }

    saveCart();
}

function removeItem(index) {

    cart.splice(index, 1);

    saveCart();
}

function saveCart() {

    localStorage.setItem(
        "bloomCart",
        JSON.stringify(cart)
    );

    displayCart();
}

function checkout() {

    if (cart.length === 0) {
        alert("Please add products to your cart first!");
        return;
    }

    window.location.href = "{{ url_for('checkout') }}";
}

displayCart();

</script>

</body>
</html>
